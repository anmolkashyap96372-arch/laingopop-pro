<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>LaingoPop Admin</title>
<style>body{font:15px system-ui;background:#0b1020;color:#fff;margin:0;padding:16px;max-width:560px;margin:auto}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #334;background:#141b34;color:#fff;font:inherit;box-sizing:border-box}
button{background:#2563eb;border:0;font-weight:700}.r{background:#141b34;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}
.x{background:#7f1d1d;width:auto;padding:6px 12px;font-size:12px}small{color:#9aa}</style>
<h2>LaingoPop Pro Panel</h2>
<input id=key type=password placeholder="Admin key" oninput="localStorage.k=this.value;load()">
<input id=ref placeholder="Order ref (e.g. LP-7K3Q9)">
<input id=ip placeholder="IP address (optional, weak)">
<select id=plan><option value=yearly>Yearly (365 days)</option><option value=monthly>Monthly (30 days)</option><option value=week>7-Day Pass</option></select>
<input id=days type=number min=1 placeholder="Custom days (optional, plan ke din ki jagah)">
<input id=note placeholder="Note (name / WhatsApp no.)">
<button onclick=grant()>Activate Pro</button><small id=msg></small>
<h3>Active / past</h3><div id=list></div>
<script>
const $=i=>document.getElementById(i),H=()=>({'Content-Type':'application/json','x-admin-key':$('key').value});
$('key').value=localStorage.k||'';
async function grant(){const r=await fetch('/api/admin/grant',{method:'POST',headers:H(),body:JSON.stringify({ref:$('ref').value,ip:$('ip').value,plan:$('plan').value,days:$('days').value,note:$('note').value})});
$('msg').textContent=r.ok?'Done. User ko refresh karne bolo.':'Error: '+(await r.text());if(r.ok){$('ref').value=$('ip').value=$('note').value=$('days').value=''}load()}
async function rev(id){await fetch('/api/admin/revoke',{method:'POST',headers:H(),body:JSON.stringify({id})});load()}
async function load(){const r=await fetch('/api/admin/list',{headers:H()});if(!r.ok){$('list').innerHTML='';return}
$('list').innerHTML=(await r.json()).map(g=>{const on=g.expiresAt>Date.now();return `<div class=r><b>${g.ref||'-'}</b> · ${g.ip||'-'} · ${g.plan}<br>${on?'✅ till '+new Date(g.expiresAt).toLocaleDateString():'⛔ ended'} ${g.note?'· '+g.note:''} ${on?`<button class=x onclick="rev('${g.id}')">Remove</button>`:''}</div>`}).join('')}
load();
</script>
